<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задача 3 </title>
    <style>
       
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f4f4;
            padding: 20px;
        }

        .layout {
            width: 100%;
            max-width: 800px;
            height: 600px; 
            background-color: #fff;
            border: 2px solid #7b9cb3; 
            display: flex;
            flex-direction: column;
        }

        
        .header {
            height: 100px;
            border-bottom: 1px solid #000;
            padding: 5px 10px;
            font-size: 14px;
        }

        .main-section {
            display: flex;
            flex-grow: 1; 
        }

        
        .sidebar {
            width: 250px; 
            border-right: 1px solid #000;
            padding: 5px 10px;
            font-size: 14px;
        }

        
        .content {
            flex-grow: 1; 
            padding: 5px 10px;
            font-size: 14px;
        }

    
        .footer {
            height: 120px;
            border-top: 1px solid #000;
            padding: 5px 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="layout">
        <header class="header">header</header>
        
        <div class="main-section">
            <aside class="sidebar">sidebar</aside>
            <main class="content">content</main>
        </div>
        
        <footer class="footer">footer</footer>
    </div>

</body>
</html>
