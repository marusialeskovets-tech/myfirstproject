<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Задача 2.8</title>
    </head>
    <body>
        <h1>Запись на курсы</h1>
        <hr>
        <form>
            <fieldset>
            <label for="name">Имя:</label>
            <input type="text" id="name" name="name" placeholder="Ваше имя">
            </fieldset>
            <fieldset>
                <label>Язык программирвания</label>
                <label>
                <input type="radio" name="lang" value="cpp"> C++
                </label>
                <label>
                 <input type="radio" name="lang" value="php"> PHP   
                </label>
                 <label>
                 <input type="radio" name="lang" value="java">java 
                </label>
           </fieldset>
            <fieldset>
                <label for="info">Дополнительная информация</label>
                <textarea id="info" name="extra_info"></textarea>
            </fieldset>
            <fieldset>
                <label for="secret">Секретное слово</label>
                <input type="password" id="secret" name="secret_word">
            </fieldset>
            <fieldset>
                <button type="submit">Отправить</button>
                <button type="reset">Очистить</button>
            </fieldset>
        </form>
        <hr>
        <p>
        <cite>&copy; www.bsuir.by/ru/kaf-ikt</cite>
    </p>
    </body>
</html>
