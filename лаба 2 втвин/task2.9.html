<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Задача 2.9</title>
    </head>
    <body>
        <main>
            <section>
                <form>
                    <fieldset>
                        <legend>Выберите любимый фрукт</legend>
                        <p class="form-row">
                            <label for="fruit">Фрукт</label>
                            <select id="fruit" name="fruit">
                                <option value="pineapple">Ананас</option>
                                <option value="apricot">Абрикос</option>
                                <option value="watermelon">Арбуз</option>
                                <option value="avocado">Авокадо</option>
                                <option value="orange">Апельсин</option>
                            </select>
                        </p>
                        <p>
                            <button type="submit">Отправить информацию</button>
                        </p>
                    </fieldset>
                </form>
            </section>
        </main>
    </body>
</html>
